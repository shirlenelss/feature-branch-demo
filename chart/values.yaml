# Defaults shared by every service. A service's own values file
# (service/<name>/<env>.yaml) only needs to set what's specific to it:
# name, image, and env -- everything below is a sane fallback.

name: ""

image:
  repository: ""
  tag: ""

port: 8080

replicas: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Extra env vars beyond the always-present ENVIRONMENT/IMAGE_TAG, e.g.
# SERVICE_B_URL for service-a. Empty map by default.
env: {}

# External URL via Istio + Traefik, at <name>.<env>.apps.shirlenelim.se.
# Off by default; a service's env file turns it on (prod does). env must
# be set (dev/stage/prod/...) when enabled, since it's part of the hostname.
route:
  enabled: false
  env: ""

# Size of each feature build (features.yaml). Deliberately separate from
# replicas/resources above, so scaling a service's main build in prod
# doesn't scale every feature preview with it.
featureBuild:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
